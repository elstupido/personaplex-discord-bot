# WHY THIS FILE EXISTS:
# Pure stage-partitioning config for Qwen2.5-Omni on a single RTX 5090.
# We stripped the 'engine_args' bloat; the engine gets those from the CLI.
# This file only manages the physical partitioning of the internal stages.

async_chunk: false

stages:
  - stage_id: 0
    # Fish Logic Core (Reasoning)
    max_num_seqs: 1
    gpu_memory_utilization: 0.30
    enforce_eager: false
    devices: "0"

  - stage_id: 1
    # Fish Acoustic Generator (S2P)
    max_num_seqs: 1
    gpu_memory_utilization: 0.30
    enforce_eager: false
    devices: "0"

  - stage_id: 2
    # Fish Waveform Renderer (Vocoder)
    max_num_seqs: 1
    gpu_memory_utilization: 0.10
    enforce_eager: false
    devices: "0"
