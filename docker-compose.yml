services:
  # 🧠 THE BRAIN: Leviathan  # 🧠 THE BRAIN: vLLM-Omni with Fish-Speech
  # WHY: Disaggregated LLM/TTS engine on RTX 5090.
  vllm-brain:
    build:
      context: .
      dockerfile: vllm_brain.Dockerfile
    container_name: vllm-brain
    runtime: nvidia
    ipc: host
    shm_size: '4gb'
    network_mode: host
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - HF_HOME=/app/model_cache
      - VLLM_LOGGING_LEVEL=INFO
      - VLLM_ATTENTION_BACKEND=FLASH_ATTN
      - NCCL_P2P_DISABLE=1
      - NCCL_IB_DISABLE=1
      - PYTHONUNBUFFERED=1
      - CUDA_LAUNCH_BLOCKING=1
      - VLLM_DEVICE_CAP_OVERRIDE=9.0
      - HF_TOKEN=${HF_TOKEN}
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
    volumes:
      - ./model_cache:/app/model_cache
      - ./brain_entrypoint.sh:/app/brain_entrypoint.sh
      - ./qwen2_5_omni_5090.yaml:/app/qwen2_5_omni_5090.yaml
    depends_on:
      bot-ears:
        condition: service_healthy
    entrypoint: /app/brain_entrypoint.sh
    command: >
      --port 8000  --host 0.0.0.0  --model fishaudio/s2-pro --trust-remote-code --config /app/qwen2_5_omni_5090.yaml --omni
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

  # 👂 THE EARS: Standalone SenseVoice ASR (FunASR)
  # WHY: Disaggregated GPU/CPU transcription service.
  bot-ears:
    build:
      context: .
      dockerfile: bot_ears.Dockerfile
    container_name: bot-ears
    ipc: host
    shm_size: '4gb'
    network_mode: host
    restart: always
    environment:
      - HF_HOME=/app/model_cache
      - PYTHONUNBUFFERED=1
    volumes:
      - ./src/bot_ears_server.py:/app/bot_ears_server.py
      - ./model_cache:/app/model_cache
      - ./ears_entrypoint.sh:/app/ears_entrypoint.sh
    entrypoint: /app/ears_entrypoint.sh
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8765/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

  # --- THE BODY: PersonaPlex Discord Orchestrator ---
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bot
    network_mode: host
    restart: always
    depends_on:
      vllm-brain:
        condition: service_healthy
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - GUILD_ID=${GUILD_ID}
      - MODEL_TYPE=${MODEL_TYPE}
      - HF_TOKEN=${HF_TOKEN}
      - VOICE_PRESET=${VOICE_PRESET}
      - TEXT_PROMPT=${TEXT_PROMPT}
      - LOG_LEVEL=${LOG_LEVEL}
      - WAKE_WORD=${WAKE_WORD}
      - VLLM_URL=http://localhost:8000/v1/chat/completions
      - VLLM_SPEECH_URL=http://localhost:8000/v1/audio/speech
      - STUPID_BLUEPRINT=qwen-fish
      - PYTHONPATH=/app/src
      - STUPID_DIAGNOSTICS=1
    volumes:
      - ./model_cache:/app/model_cache
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./scripts/supervisor.py:/app/supervisor.py
      - ./tests:/app/tests
      - ./voice_profiles:/app/voice_profiles
    entrypoint: [ "python", "src/core/bot.py" ]
